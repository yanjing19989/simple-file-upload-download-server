<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件上传与下载</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 20px 10px;
            background: #f2f2f2;
            color: #222222;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 16px;
        }
        .container {
            width: auto;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #cccccc;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
            text-align: center;
        }
        h2 {
            margin: 28px 0 12px 0;
            font-size: 20px;
        }
        .file-input {
            width: 100%;
            margin-bottom: 10px;
        }
        .button {
            width: 100%;
            margin: 5px 0;
            padding: 9px 6px;
            border: 1px solid #555555;
            background: #eeeeee;
            color: #111111;
            font-size: 16px;
            cursor: pointer;
        }
        .upload-button {
            border-color: #0056b3;
            background: #007bff;
            color: #ffffff;
        }
        .refresh-button {
            border-color: #117a8b;
            background: #17a2b8;
            color: #ffffff;
        }
        .hint, .status, .notice {
            margin: 8px 0;
            line-height: 1.5;
        }
        .hint {
            color: #555555;
            font-size: 14px;
        }
        .status {
            color: #555555;
        }
        .error {
            color: #b00020;
        }
        .notice {
            padding: 8px 10px;
            border: 1px solid #8ac38a;
            background: #eef9ee;
            color: #176b17;
        }
        .file-table {
            width: 100%;
            margin: 8px 0 12px 0;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .file-table th, .file-table td {
            padding: 7px 5px;
            border-bottom: 1px solid #dddddd;
            text-align: left;
            vertical-align: top;
        }
        .file-table .size-column {
            width: 100px;
            text-align: right;
        }
        .file-link {
            color: #0056b3;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>文件上传与下载</h1>
    {upload_notice}

    <h2>上传文件</h2>
    <form id="uploadForm" method="post" action="/upload"
          enctype="multipart/form-data" onsubmit="return validateUpload();">
        <input type="hidden" name="response" value="classic">
        <input class="file-input" type="file" id="fileInput" name="file">
        <p class="hint">每次只能上传一个文件；同名文件会被直接覆盖。</p>
        <input class="button upload-button" type="submit" value="上传">
    </form>

    <h2>下载文件</h2>
    <p id="listStatus" class="status">正在读取文件列表……</p>
    <table id="fileTable" class="file-table" style="display: none;">
        <thead>
        <tr>
            <th>文件名</th>
            <th class="size-column">大小</th>
        </tr>
        </thead>
        <tbody id="fileList"></tbody>
    </table>
    <input class="button refresh-button" type="button" value="刷新列表"
           onclick="refreshList();">
</div>
<script type="text/javascript">
function formatSize(bytes) {
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var value = parseFloat(bytes);
    var index = 0;
    if (isNaN(value) || value < 0) {
        value = 0;
    }
    while (value >= 1024 && index < units.length - 1) {
        value = value / 1024;
        index = index + 1;
    }
    return value.toFixed(2) + ' ' + units[index];
}

function createRequest() {
    if (window.XMLHttpRequest) {
        return new XMLHttpRequest();
    }
    try {
        return new ActiveXObject('Microsoft.XMLHTTP');
    } catch (error) {
        return null;
    }
}

function clearElement(element) {
    while (element.firstChild) {
        element.removeChild(element.firstChild);
    }
}

function setListStatus(message, isError) {
    var status = document.getElementById('listStatus');
    clearElement(status);
    status.className = isError ? 'status error' : 'status';
    status.appendChild(document.createTextNode(message));
}

function validateUpload() {
    var input = document.getElementById('fileInput');
    if (!input.value) {
        alert('请选择一个文件');
        return false;
    }
    return true;
}

function renderFiles(data) {
    var files = data && data.files ? data.files : [];
    var table = document.getElementById('fileTable');
    var list = document.getElementById('fileList');
    var index;
    clearElement(list);

    if (!files.length) {
        table.style.display = 'none';
        setListStatus('当前没有可下载的文件。', false);
        return;
    }

    for (index = 0; index < files.length; index = index + 1) {
        var file = files[index];
        var row = document.createElement('tr');
        var nameCell = document.createElement('td');
        var sizeCell = document.createElement('td');
        var link = document.createElement('a');

        link.className = 'file-link';
        link.href = '/download?file=' + encodeURIComponent(file.name);
        link.appendChild(document.createTextNode(file.name));
        nameCell.appendChild(link);

        sizeCell.className = 'size-column';
        sizeCell.appendChild(document.createTextNode(formatSize(file.size)));
        row.appendChild(nameCell);
        row.appendChild(sizeCell);
        list.appendChild(row);
    }

    table.style.display = '';
    setListStatus('共 ' + files.length + ' 个文件，点击文件名即可下载。', false);
}

function refreshList() {
    var request = createRequest();
    if (!request) {
        setListStatus('当前浏览器无法读取文件列表。', true);
        return;
    }

    setListStatus('正在读取文件列表……', false);
    request.onreadystatechange = function () {
        var data;
        if (request.readyState !== 4) {
            return;
        }
        if (request.status !== 200) {
            setListStatus('读取文件列表失败，请稍后重试。', true);
            return;
        }
        try {
            data = window.JSON.parse(request.responseText);
            renderFiles(data);
        } catch (error) {
            setListStatus('服务器返回的文件列表无效。', true);
        }
    };

    try {
        request.open('GET', '/list?_=' + new Date().getTime(), true);
        request.send(null);
    } catch (error) {
        setListStatus('无法连接到服务器。', true);
    }
}

window.onload = refreshList;
</script>
</body>
</html>
